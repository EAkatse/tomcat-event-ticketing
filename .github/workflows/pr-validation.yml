name: PR Validation

on:
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  validate:
    name: Validate Code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
           fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip install flake8 pylint pytest pytest-cov

      - name: Lint with flake8
        run: |
          flake8 src/ --count --max-complexity=10 --max-line-length=127 --statistics --ignore=E302,E305,W293,W292,F401,F841,E501,C901,E402
          flake8 tests/ --count --max-complexity=10 --max-line-length=127 --statistics --ignore=E302,E305,W293,W292,F401,F841,E501,C901,E402

      - name: Lint with pylint
        run: |
          pylint src/ --fail-under=7.0 || true
          pylint tests/ --fail-under=7.0 || true

      - name: Validate SAM template
        run: |
          sam validate --template-file template.yaml

      - name: Run unit tests with coverage
        env:
          AWS_DEFAULT_REGION: us-east-1
          AWS_ACCESS_KEY_ID: testing
          AWS_SECRET_ACCESS_KEY: testing
        run: |
          pytest tests/unit/ -v --cov=src --cov-report=term-missing --cov-fail-under=70

      - name: Upload test coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 7

      - name: Check for secrets in code
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}